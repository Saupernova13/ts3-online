name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            loader/target
            setup/target
          key: cargo-win-${{ hashFiles('loader/Cargo.lock', 'setup/Cargo.lock') }}
      - name: Test
        run: |
          (cd loader && cargo test)
          (cd setup && cargo test)
      - name: Build
        run: |
          (cd loader && cargo build --release)
          (cd setup && cargo build --release)
          mkdir -p out && cp loader/target/release/dinput8.dll setup/target/release/ts3-online-setup.exe out/
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/

  linux:
    # the oldest supported runner, so the setup program runs on older glibc too (SteamOS, Ubuntu LTS)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            setup/target
          key: cargo-linux-${{ hashFiles('loader/Cargo.lock', 'setup/Cargo.lock') }}
      - name: Test and build
        working-directory: setup
        run: |
          cargo test
          cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: setup/target/release/ts3-online-setup

  package:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Package
        # zipped here so the Linux program keeps its executable bit
        run: |
          mkdir -p dist/ts3-online
          cp built/windows/dinput8.dll built/windows/ts3-online-setup.exe built/linux/ts3-online-setup dist/ts3-online/
          chmod +x dist/ts3-online/ts3-online-setup
          cp tools/local-coop.ps1 tools/LocalCoop.cmd LICENSE dist/ts3-online/
          cp docs/PLAYING.md dist/ts3-online/README.md
          cd dist && zip -qr ts3-online.zip ts3-online
      - uses: actions/upload-artifact@v4
        with:
          name: ts3-online
          path: dist/ts3-online.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the setup program compares the tag with the version built into the DLL
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' loader/Cargo.toml | head -1)
          setup=$(sed -n 's/^version = "\(.*\)"/\1/p' setup/Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] && [ "$setup" = "$version" ] || { echo "tag $GITHUB_REF_NAME, loader $version, setup $setup disagree"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/ts3-online.zip --title "$GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
