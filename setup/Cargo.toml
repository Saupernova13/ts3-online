[package]
name = "ts3online-setup"
version = "1.8.0"
edition = "2021"
description = "Setup and settings for ts3-online, on Windows and Linux (Proton)"
license = "MIT"
repository = "https://github.com/Saupernova13/ts3-online"

[[bin]]
name = "ts3-online-setup"
path = "src/main.rs"

[dependencies]
ts3online = { path = "../loader" }
eframe = { version = "=0.29.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ureq = { version = "=2.10.1", features = ["json"] }
zip = { version = "=2.2.0", default-features = false, features = ["deflate"] }
serde_json = "1"
png = "=0.17.13"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"]

[profile.release]
lto = true
codegen-units = 1
strip = true
